runtime: python310
service: frontend
handlers:
  # Serve files with extensions (likely static assets)
  - url: /(.*\..+)$
    static_files: build/web/\1
    upload: build/web/(.*\..+)$
  # Serve everything else (routes) as index.html
  - url: .*
    static_files: build/web/index.html
    upload: build/web/index.html
